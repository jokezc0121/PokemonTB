<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - Pokémon Team Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="pagina-form">
    <div class="caja-form">
      <a href="index.html" class="logo">Team<span>Builder</span></a>
      <h1>Crear cuenta</h1>

      <form id="form-registro" novalidate>
        <div class="campo">
          <label for="nombre">Nombre de entrenador</label>
          <input type="text" id="nombre" placeholder="Ej. AshCali">
          <span class="error" id="error-nombre"></span>
        </div>

        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" placeholder="entrenador@correo.com">
          <span class="error" id="error-correo"></span>
        </div>

        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" placeholder="Mínimo 8 caracteres">
          <span class="error" id="error-clave"></span>
        </div>

        <div class="campo">
          <label for="confirmar">Confirmar contraseña</label>
          <input type="password" id="confirmar" placeholder="Repite la contraseña">
          <span class="error" id="error-confirmar"></span>
        </div>

        <button type="submit" class="boton boton-principal">Registrarme</button>
        <p class="mensaje" id="mensaje"></p>
      </form>

      <p class="enlace-form">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </main>

  <script src="js/validacion.js"></script>
</body>
</html>
